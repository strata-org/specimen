name = "specimen"
version = "0.1.0"
defaultTargets = ["Specimen"]
testRunner = "SpecimenTest"
lintDriver = "batteries/runLinter"

[leanOptions]
linter.missingDocs = false

[[lean_lib]]
name = "SpecimenTest"

[[lean_lib]]
name = "Specimen"
# `Specimen.Interp` is opt-in, not imported by `Specimen`, so it is a root of its own.
roots = ["Specimen", "Specimen.Interp"]

[[require]]
name = "batteries"
scope = "leanprover-community"
rev = "f2effa3d803fda822b1f97b806c47cf2adfbcbc2"

[[require]]
name = "plausible"
scope = "leanprover-community"
rev = "118aa17ee84656b8bd727fef7c458ee8c833385c"

[[require]]
name = "proofwidgets"
scope = "leanprover-community"
rev = "106ff4fafc74ef4ac99d81dbf3ab399118f497a5"

# Basalt, for `specimen.emitBasalt`. It requires Mathlib, which comes with it: run `lake exe cache get`
# after cloning to download Mathlib's build rather than compiling it (`lake update` runs it by itself). The batteries, plausible and
# proofwidgets revisions above are the ones Mathlib's release pins; keep them in step with it.
[[require]]
name = "basalt"
git = "https://github.com/hgoldstein95/basalt"
rev = "a6a783526afd1642792dda1863705dd37113160e"
