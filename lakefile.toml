name = "specimen"
version = "0.1.0"
defaultTargets = ["Specimen"]
testRunner = "SpecimenTest"
lintDriver = "batteries/runLinter"

[leanOptions]
linter.missingDocs = false

[[lean_lib]]
name = "SpecimenTest"
# `SpecimenTest.Proofs` (the SPMF correctness development) is a root of its own: it reaches Mathlib
# through Basalt, and Mathlib's root-level names clash with the suite's at an import join.
roots = ["SpecimenTest", "SpecimenTest.Proofs"]
# To build the whole test library against Basalt, uncomment. It has to be library-wide, since a module
# compiled with the flag off cannot serve one compiled with it on, and `weak.` is required for the modules
# that never import the option. See Docs/Specimen-Basalt-port.md.
# leanOptions = { weak.specimen.emitBasalt = true }

[[lean_lib]]
name = "Specimen"
# `Specimen.Interp`, `Specimen.Basalt` and `Specimen.Enum` are opt-in, not imported by `Specimen`, so
# they are roots of their own.
roots = ["Specimen", "Specimen.Interp", "Specimen.Basalt", "Specimen.Enum"]

[[require]]
name = "batteries"
scope = "leanprover-community"
rev = "66e469188fe07963e5cf666c7d4433f45b8131c5"

[[require]]
name = "plausible"
scope = "leanprover-community"
rev = "dfa4f38190d07c37e315953e08b90fe2d95b3c24"

[[require]]
name = "proofwidgets"
scope = "leanprover-community"
rev = "df72b022e558978a1c50264cfc4d7fec86fa8e04"

# Basalt, for `specimen.emitBasalt`. It requires Mathlib, which comes with it: run `lake exe cache get`
# after cloning to download Mathlib's build rather than compiling it (`lake update` runs it by itself). The batteries, plausible and
# proofwidgets revisions above are the ones Mathlib's release pins; keep them in step with it.
[[require]]
name = "basalt"
git = "https://github.com/hgoldstein95/basalt"
rev = "2c6e912897f96ab8838617f69494a5916b2ef078"

# Benchmarks, in `bench/`. `lake build Bench` compiles them; nothing runs them by default. Each has an
# executable for timing compiled code. See bench/README.md.
[[lean_lib]]
name = "Bench"
srcDir = "bench"
globs = ["Bench.+"]

[[lean_exe]]
name = "bench-enum-interp"
srcDir = "bench"
root = "Bench.EnumInterp"
